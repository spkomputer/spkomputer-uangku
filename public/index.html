<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><meta name="description" content="Rekap keuangan SPKomputer"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>Uangku SPKomputer</title></head><body>
<div id="login" class="login"><form id="loginForm" class="login-card"><div class="logo">U</div><h1>Uangku</h1><p>Keuangan SPKomputer dalam satu tempat</p><input id="password" type="password" autocomplete="current-password" placeholder="Password admin" required><button>Masuk</button><small id="loginError"></small></form></div>
<main id="app" hidden><header><div class="brand"><span class="logo">U</span><div><b>Uangku</b><small>SPKomputer</small></div></div><div class="header-actions"><button id="install" class="soft" hidden>Pasang</button><button id="logout" class="soft">Keluar</button></div></header><div class="wrap">
<section class="balance"><span>Sisa uang bulan ini</span><strong id="balance">Rp0</strong><div class="stats"><div><small>Masuk</small><b id="income">Rp0</b></div><div><small>Keluar</small><b id="expense">Rp0</b></div></div></section>
<section><h2>Dompet terpisah</h2><p class="muted">Pribadi dan usaha tidak tercampur</p><div id="wallets" class="wallets"></div></section>
<section class="chat"><h2>✨ Catat seperti chat</h2><p class="muted">Contoh: servis laptop 250rb masuk</p><form id="chatForm"><input id="chatInput" placeholder="Ketik transaksi..." autocomplete="off"><button>＋</button></form><div class="chips"><button data-text="servis laptop 250rb masuk">Servis 250rb</button><button data-text="beli kabel wifi 175rb">Kabel WiFi</button><button data-text="sewa laptop 500rb masuk">Rental 500rb</button></div></section>
<section><div class="section-head"><div><h2>Jejak transaksi</h2><p class="muted">Mudah dicari dan diedit</p></div><button id="add" class="soft">＋ Detail</button></div><div class="filters"><input id="search" placeholder="Cari catatan..."><select id="filter"><option value="semua">Semua</option><option value="pribadi">Pribadi</option><option value="servis">Servis</option><option value="rental">Rental</option><option value="wifi">WiFi</option></select></div><div id="list"></div></section>
</div></main>
<dialog id="editor"><form id="editForm"><div class="section-head"><h2 id="formTitle">Transaksi baru</h2><button type="button" id="close" class="icon-btn">✕</button></div><div class="type-tabs"><button type="button" data-kind="income" class="active">Uang masuk</button><button type="button" data-kind="expense">Uang keluar</button></div><label>Dompet<select id="book"><option value="pribadi">Pribadi</option><option value="servis">Usaha Servis</option><option value="rental">Usaha Rental</option><option value="wifi">Usaha WiFi</option></select></label><label>Nominal<input id="amount" inputmode="numeric" placeholder="250000" required></label><label>Catatan<input id="note" placeholder="Contoh: servis ganti SSD" required></label><label>Tanggal<input id="date" type="date" required></label><button class="primary">Simpan</button></form></dialog>
<div id="toast"></div><script src="/app.js" defer></script></body></html>
